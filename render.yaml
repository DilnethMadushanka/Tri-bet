# Render Blueprint: New > Blueprint, pick this repo. Creates the web service with a 1 GB disk for the database.
services:
  - type: web
    name: betdouble
    runtime: node
    plan: starter            # a disk needs a paid plan (Free has no disk, so data would be lost)
    buildCommand: npm ci --omit=dev
    startCommand: node --no-warnings src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DB_PATH
        value: /var/data/betdouble.sqlite
      - key: ADMIN_USERNAME
        sync: false          # Render asks you for this: the username that becomes admin
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
